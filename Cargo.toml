[workspace]
members = [
    "crates/alterbot",
    "crates/entry"
]
resolver = "3"
default-members = ["crates/entry"]

[workspace.dependencies]
anyhow = "1.0.104"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/thatgurkangurk/alter-bot"
license = "MPL-2.0"
authors = ["gurkan"]

# --- Global Lint Rules ---
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# Set broad groups to a lower priority (-1) so exceptions can override them
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Catch common panic-inducing methods
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"

# --- Lint Exceptions ---
# (These implicit priority 0 lints will now successfully override the -1 groups above)
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
