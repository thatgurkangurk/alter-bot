[package]
name = "entry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
alterbot = { path = "../alterbot" }
alterconfig = { path = "../alterconfig" }
rustls = { default-features = false, version = "0.23.46", features = ["ring"] }
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic", "logs"] }
opentelemetry-appender-tracing = "0.33.1"
