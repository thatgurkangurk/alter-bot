[package]
name = "alterbot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["chrono", "env-filter"] }
sea-orm = { version = "^2.0.0", features = ["runtime-tokio-rustls", "entity-registry", "schema-sync", "sqlx-postgres"] }
uuid = { version = "1.24.0", features = ["v4"] }
chrono = "0.4.45"
craftping = { version = "0.7.0", features = ["async-tokio"] }
serde_json = "1.0.151"
ferinth = "2.13.1"
reqwest.workspace = true
url = "2.5.8"
toml = "1.1.3"
futures = "0.3.33"
axum = "0.8.9"
dashmap = "6.2.1"
quoter = { path = "../quoter" }
alterconfig = { path = "../alterconfig" }
thiserror.workspace = true
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
twilight-util = { version = "0.17", features = ["builder"] }
either = "1.19.0"
arc-swap = "1.9.3"
inventory = "0.3.25"
async-trait = "0.1.92"
twilight-cache-inmemory = "0.17.1"
